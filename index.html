    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Brain Gym",
      "url": "https://chainword-five.vercel.app",
      "description": "Four free daily word puzzles: Chainword (word ladder), 4word (Wordle variant), Tiles (Scrabble-style scoring), and Squares (word square).",
      "applicationCategory": "GameApplication",
      "genre": "Word Game",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "inLanguage": "en",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Sandesh Goel"
      },
      "hasPart": [
        {
          "@type": "Game",
          "name": "Chainword",
          "url": "https://chainword-five.vercel.app/chainword",
          "description": "Link two 4-letter words by changing one letter at a time — a daily word ladder puzzle.",
          "genre": "Word Puzzle"
        },
        {
          "@type": "Game",
          "name": "4word",
          "url": "https://chainword-five.vercel.app/4word",
          "description": "Guess the hidden 4-letter word in 6 tries. Green means right letter, right place; orange means right letter, wrong place.",
          "genre": "Word Puzzle"
        },
        {
          "@type": "Game",
          "name": "Tiles",
          "url": "https://chainword-five.vercel.app/tiles",
          "description": "Build the highest-scoring 4-letter word from 7 Scrabble-style letter tiles with double and triple letter bonuses.",
          "genre": "Word Puzzle"
        },
        {
          "@type": "Game",
          "name": "Squares",
          "url": "https://chainword-five.vercel.app/squares",
          "description": "Fill the four corners of a square so that all four 4-letter words — top, bottom, left, right — are valid.",
          "genre": "Word Puzzle"
        }
      ]
    }
    </script>

    <!-- Structured data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Brain Gym?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Brain Gym is a free daily word puzzle app with four games: Chainword (word ladder), 4word (Wordle-style), Tiles (Scrabble scoring), and Squares (word square). New puzzles are released every day."
          }
        },
        {
          "@type": "Question",
          "name": "How often do the puzzles reset?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "New puzzles are released every day at midnight IST (Indian Standard Time)."
          }
        },
        {
          "@type": "Question",
          "name": "Is Brain Gym free to play?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, all four daily puzzles are completely free with no ads or subscriptions."
          }
        },
        {
          "@type": "Question",
          "name": "Can I play past puzzles?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Use the Archives button inside any game to browse and play any past puzzle."
          }
        },
        {
          "@type": "Question",
          "name": "What is Chainword?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chainword is a daily word ladder puzzle. You are given a start word and an end word (both 4 letters), and must connect them by changing one letter at a time, where each step must be a valid English word."
          }
        },
        {
          "@type": "Question",
          "name": "How is Tiles different from Scrabble?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In Tiles, you are dealt 7 letter tiles and must form the highest-scoring 4-letter word. The slots have double-letter and triple-letter bonuses. Unlike Scrabble, there is no board — you simply find the best word from your rack."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
